<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <title>Главная</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" style="width: 22%; border-radius: 10px;">
        <div class="container-fluid">
            <form class="container-fluid justify-content-start">
                <button type="button" class="btn btn-outline-danger active btn-lg" style="width: 120px;">Главная</button>
                <button type="button" class="btn btn-outline-success btn-lg" onclick="openConstructor()" style="width: 120px;">Добавить склад</button>
                <button type="button" class="btn btn-outline-danger btn-lg" style="width: 120px;">text</button>
            </form>
        </div>
    </nav>
    <!-- Модальное окно конструктора -->



    <div class="main-1">
        <form method="GET" class="input-group input-group-lg search-form">
            <input type="text"
                   class="form-control"
                   id="itemInput"
                   name="q"
                   placeholder="ПОИСК"
                   aria-label="Поисковый запрос"
                   aria-describedby="search-label"
                   autocomplete="off">
            <button onclick="addItem()" class="btn btn-danger" type="submit">Найти</button>
        </form>
        <div class="inner-window" id="innerWindow">
            <span class="close-btn" onclick="closeInnerWindow()">✕</span>
            <ul id="items-list"></ul>
        </div>
        <hr class="w-100 my-5">

    </div>
    <div class="container border border-5 border-danger rounded-5">
        <div id="storages" class="w-100"></div>
    </div>
    <script src="js/main.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
</body>
</html>
