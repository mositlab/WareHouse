<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <title>Система управления складами</title>
    <script>
      

        function myFunction() {
            console.log("Страница полностью загружена!");
        }

    </script>
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary" style="width: 22%; border-radius: 10px;">
        <div class="container-fluid">
            <div class="d-flex flex-column gap-2 w-100">
                <button type="button" class="btn btn-outline-danger active btn-lg">Главная</button>
                <button type="button" class="btn btn-outline-success btn-lg" data-bs-toggle="modal" data-bs-target="#Constructor">Добавить склад</button>
                <button type="button" class="btn btn-outline-danger btn-lg">Настройки</button>
            </div>
        </div>
    </nav>

    <!-- Модальное окно конструктора складов -->
     <form id="ConstructorStorageForm">
    <div class="modal fade" id="Constructor" tabindex="-1" aria-labelledby="constructorModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="constructorModalLabel">Добавление склада</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="storageNumberInput" class="form-label">Введите номер склада:</label>
                        <input type="number" class="form-control" id="storageNumberInput" placeholder="Например: 1" min="1">
                    </div>
                    <div class="mb-3">
                        <label for="storageNameInput" class="form-label">Введите название склада:</label>
                        <input type="text" class="form-control" id="storageNameInput" placeholder="Например: Кладовка с болтами">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-success">Добавить склад</button>
                </div>
            </div>
        </div>
    </div>
</form>

    <!-- Основное содержимое -->
    <div class="main-1">
        <!-- Форма поиска -->
        <div class="container mt-4">
            <div class="input-group input-group-lg search-form">
                <input type="text"
                       class="form-control"
                       id="itemInput"
                       placeholder="ПОИСК ПО ПРЕДМЕТАМ"
                       aria-label="Поисковый запрос"
                       autocomplete="off">
                <button onclick="searchItems()" class="btn btn-danger" type="button">Найти</button>
            </div>
        </div>

        <!-- Окно результатов поиска -->
        <div class="inner-window" id="innerWindow" style="display: none;">
            <span class="close-btn" onclick="closeInnerWindow()">✕</span>
            <h6>Результаты поиска:</h6>
            <ul id="items-list"></ul>
        </div>

        <hr class="w-100 my-5">

        <!-- Кнопки навигации по складам -->
        <div class="container mt-4 text-center">
            <h5>Ваши склады</h5>
            <div id="storageButtons" class="d-flex flex-wrap justify-content-center gap-2 mb-4">
                <!-- Кнопки складов будут добавлены динамически -->
            </div>
        </div>
    </div>

    <!-- Контейнер для складов -->
    <div class="container border border-5 border-danger rounded-5">
        <div id="storagesContainer" class="w-100">
            <!-- Склады будут добавлены динамически -->
        </div>
    </div>

    <!-- Подключение скриптов -->
    <script>
        const numberInput = document.getElementById("storageNumberInput");
        const nameInput = document.getElementById("storageNameInput");

        const storageId = numberInput.value.trim();
        const storageName = nameInput.value.trim();

    </script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
