<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Auth Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2f2f2f;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .auth-container {
            width: 400px;
            max-width: 90%;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            font-size: 14px;
        }

        .success-message {
            color: #4ecdc4;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Форма логина -->
        <div class="form-container" id="loginForm">
            <h2 class="text-center mb-4">Вход</h2>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="Введите email" />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Введите пароль" />
            </div>
            <button type="button" id="submitLogin" class="btn btn-success w-100 mb-3">Войти</button>
            <button type="button" id="showRegister" class="btn btn-link w-100 text-light">Нет аккаунта? Зарегистрироваться</button>
            <div id="loginError" class="error-message" style="display: none;"></div>
        </div>

        <!-- Форма регистрации -->
        <div class="form-container" id="registerForm" style="display: none;">
            <h2 class="text-center mb-4">Регистрация</h2>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="registerEmail" class="form-control" placeholder="Введите email" />
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" id="registerPassword" class="form-control" placeholder="Введите пароль" />
            </div>
            <button type="button" id="submitRegister" class="btn btn-primary w-100 mb-3">Зарегистрироваться</button>
            <button type="button" id="showLogin" class="btn btn-link w-100 text-light">Уже есть аккаунт? Войти</button>
            <div id="registerError" class="error-message" style="display: none;"></div>
            <div id="registerSuccess" class="success-message" style="display: none;"></div>
        </div>

        <!-- Главная страница после входа -->
        <div class="form-container" id="mainPage" style="display: none;">
            <h2 class="text-center mb-4">Добро пожаловать!</h2>
            <p class="text-center">Вы успешно вошли в систему.</p>
            <button type="button" id="logout" class="btn btn-danger w-100">Выйти</button>
        </div>
    </div>

    <script>
        var tokenKey = "accessToken";

        // Проверяем, есть ли токен при загрузке страницы
        window.addEventListener('load', function () {
            if (sessionStorage.getItem(tokenKey)) {
                showMainPage();
            }
        });

        // Переключение между формами
        document.getElementById("showRegister").addEventListener("click", function () {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
            clearMessages();
        });

        document.getElementById("showLogin").addEventListener("click", function () {
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
            clearMessages();
        });

        // Регистрация
        document.getElementById("submitRegister").addEventListener("click", async function (e) {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;

            if (!email || !password) {
                showError("registerError", "Пожалуйста, заполните все поля");
                return;
            }

            try {
                const response = await fetch("/Auth/register", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (response.ok) {
                    showSuccess("registerSuccess", "Регистрация успешна! Теперь можете войти.");
                    setTimeout(() => {
                        document.getElementById("showLogin").click();
                    }, 1500);
                } else {
                    const errorData = await response.text();
                    showError("registerError", errorData || "Ошибка регистрации");
                }
            } catch (error) {
                showError("registerError", "Ошибка соединения с сервером");
            }
        });

        // Вход
        document.getElementById("submitLogin").addEventListener("click", async function (e) {
            e.preventDefault();
            clearMessages();

            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            if (!email || !password) {
                showError("loginError", "Пожалуйста, заполните все поля");
                return;
            }

            try {
                const response = await fetch("/Auth/login", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    sessionStorage.setItem(tokenKey, data.access_token);
                    showMainPage();
                } else {
                    const errorData = await response.text();
                    showError("loginError", errorData || "Неверный логин или пароль");
                }
            } catch (error) {
                showError("loginError", "Ошибка соединения с сервером");
            }
        });

        // Выход
        document.getElementById("logout").addEventListener("click", function () {
            sessionStorage.removeItem(tokenKey);
            showLoginForm();
        });

        // Функции для показа разных состояний
        function showMainPage() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("mainPage").style.display = "block";
        }

        function showLoginForm() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("mainPage").style.display = "none";
            clearInputs();
            clearMessages();
        }

        // Вспомогательные функции
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = "block";
        }

        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = "block";
        }

        function clearMessages() {
            document.getElementById("loginError").style.display = "none";
            document.getElementById("registerError").style.display = "none";
            document.getElementById("registerSuccess").style.display = "none";
        }

        function clearInputs() {
            document.getElementById("loginEmail").value = "";
            document.getElementById("loginPassword").value = "";
            document.getElementById("registerEmail").value = "";
            document.getElementById("registerPassword").value = "";
        }
    </script>
</body>
</html>
