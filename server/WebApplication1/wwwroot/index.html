<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>METANIT.COM</title>
    <link href="libs/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2f2f2f;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            padding-top: 1%;
            color: white;
            padding: 15%
        }
    </style>
</head>
<body>
    <div class="container border border-5 rounded-5 border-danger" style="width: 20%; text-align: center; margin: 0 auto; padding: 2%;" id="loginForm">
        <div class="mb-1" style="padding-bottom: 10%;">
            <label>Введите email</label>
            <input type="email" id="email" class="form-control" placeholder="Email"/>
        </div>
        <div class="mb-1" style="padding-bottom: 10%;">
            <label>Введите пароль</label>
            <input type="password" id="password" class="form-control" placeholder="Пароль" />
       </div>
        <div class="mb-1">
        <input type="submit" id="submitLogin" class="form-control bg-success border border-1 border-success" value="Логин" />
    </div>
    </div>
    <script>
        var tokenKey = "accessToken";
        // при нажатии на кнопку отправки формы идет запрос к /login для получения токена
        document.getElementById("submitLogin").addEventListener("click", async e => {
            e.preventDefault();
            // отправляет запрос и получаем ответ
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Accept": "application/json", "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value
                })
            });
            // если запрос прошел нормально
            if (response.ok === true) {
                // получаем данные
                const data = await response.json();
    
                // сохраняем в хранилище sessionStorage токен доступа
                sessionStorage.setItem(tokenKey, data.access_token);
                                window.location.href = "main.html";
            }
            else  // если произошла ошибка, получаем код статуса
                console.log("Status: ", response.status);
        });
    </script>
</body>
</html>
